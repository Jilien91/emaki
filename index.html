<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- interactive-widget=resizes-content makes the layout viewport itself shrink
     when the on-screen keyboard opens. Without it Android keeps the layout
     viewport at full height, so 100vh and any bottom padding become scrollable
     space below the content — enough slack for the browser to scroll the word
     off the top when it brings the answer box into view. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>Kaishi SRS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="root"><div class="loading">Loading…</div></div>
<div id="syncbadge" class="syncbadge" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/wanakana@5.3.1/wanakana.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
