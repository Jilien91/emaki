<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- interactive-widget=resizes-content makes the layout viewport itself shrink
     when the on-screen keyboard opens. Without it Android keeps the layout
     viewport at full height, so 100vh and any bottom padding become scrollable
     space below the content, enough slack for the browser to scroll the word
     off the top when it brings the answer box into view. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>Emaki</title>
<!-- The brush E with the sakura, a simplification of the full app icon: the
     enso, branch and seal in icon-source.png are lovely at 1024px and unreadable
     at 16. A real multi-resolution .ico, holding 16/32/48/64, which is what a
     browser actually draws in a tab. It was once a 1261x1247 PNG named .ico: it
     rendered, because browsers are forgiving, but it cost every visitor 2.4MB
     and the browser's own downscale of an image that size is poor.
     Every size is declared rather than left to be probed, so nothing depends on
     a file happening to sit at a conventional path. Sources for all variants,
     light, dark, red and enso, are in the private repo's Emaki-Favicon-Pack. -->
<link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48 64x64">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48x48.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64x64.png">
<link rel="icon" type="image/png" sizes="128x128" href="icons/favicon-128x128.png">
<link rel="icon" type="image/png" sizes="256x256" href="icons/favicon-256x256.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<!-- theme_color and background_color in here are the app's own #15171c, not the
     icon's white. They paint the browser chrome and the launch screen, so the
     white a favicon generator defaults to would flash bright before a dark app. -->
<link rel="manifest" href="site.webmanifest">
<!-- Emaki supplies both themes, so it says so. Declaring the pair lets the
     browser pick a canvas and style its own controls before any CSS arrives,
     and stops the standards-based auto-darkening in Chrome and Edge treating
     the page as light. It is not a guarantee everywhere: Firefox on iOS
     injects its night mode as a user script and never consults this, and
     forced-contrast modes are meant to win. -->
<meta name="color-scheme" content="light dark">
<!-- Before first paint. Applying the theme from app.js instead would show the
     default palette for a frame first, which on a light-theme reader is a full
     white-to-dark-to-white flash on every load. Reads the same settings object
     app.js writes, and stays silent if anything about it is unusable. -->
<script>
(function(){
  try{
    var s = JSON.parse(localStorage.getItem('kaishi-settings') || '{}');
    var t = s.theme || 'system';
    if(t !== 'light' && t !== 'dark'){
      t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches
        ? 'light' : 'dark';
    }
    document.documentElement.dataset.theme = t;
    document.documentElement.style.colorScheme = t;
  }catch(e){}
})();
</script>
<meta name="theme-color" content="#15171c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<!-- The rank characters, brush-written. Subsetted with the text parameter to
     the eight characters the six ranks use, so it is a few hundred bytes
     rather than a Japanese font. -->
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&text=%E6%96%B0%E4%B8%8B%E5%BF%8D%E4%B8%AD%E4%B8%8A%E6%9A%97%E9%83%A8%E5%BD%B1ACGJKNabeghinouw&display=swap" rel="stylesheet">
<!-- The rank names, angled across the scroll. Subsetted to the sixteen
     letters the six names use. -->
<link href="https://fonts.googleapis.com/css2?family=Rock+Salt&text=ACGJKNabeghinouw&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=d4a1328a">
</head>
<body>
<div id="root"><div class="loading">Loading…</div></div>
<div id="syncbadge" class="syncbadge" hidden></div>
<!-- Pinned with Subresource Integrity. These two are the only third-party code
     in the app, and without a hash a compromised CDN or a hijacked package
     would run arbitrary JavaScript here with access to signed-in sessions. The
     browser now refuses to execute either file unless it hashes to exactly
     this. Recompute when bumping a version, or the script silently stops
     loading:
       curl -sL <url> | openssl dgst -sha384 -binary | openssl base64 -A -->
<script src="https://cdn.jsdelivr.net/npm/wanakana@5.3.1/wanakana.min.js"
        integrity="sha384-ei/skGdXfWHx8zodPeKIHWR7N4qSpIlj3wBwEPMPfw2MvsbEJSFrPMUCPXnEuKSw"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.js"
        integrity="sha384-OUpie84zd1LdwNlK9uJJQRwab0BLqo3eKYKFh7hSVL58FSk7wPp2l0kfUMIIoaQd"
        crossorigin="anonymous"></script>
<script src="sync.js?v=cc76abf8"></script>
<script src="app.js?v=1284392c"></script>
</body>
</html>
